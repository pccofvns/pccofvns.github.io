career-profile:
    title: Career Profile
    summary: |
      Software engineer with 15+ years of experience working on enterprise platforms in healthcare, insurance, and digital services. Currently a Director of Software Engineering at Optum (UnitedHealth Group), working with full-stack engineering teams on platform modernization.

      Over the years, I've had the opportunity to work on large-scale migrations, platform redesigns, and greenfield builds — experiences that have shaped how I think about distributed systems, code quality, and collaborative engineering.

      Specialties: Software Engineering, Architecture &amp; Design, Java/JEE, JavaScript Ecosystems, Microservices, Distributed Systems

